<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>For you</title>

  <body>
    <div class="sky" aria-hidden="true"></div>
    <div class="room-glow" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <canvas id="fireworks" aria-hidden="true"></canvas>

    <div class="corner" id="corner" aria-hidden="true">
      <span class="mini-flame"></span>
      <span class="count" id="count">01</span>
    </div>

    <section class="gate" id="gate">
      <button class="candle" id="light" type="button" aria-label="按住烛芯">
        <span class="aura" aria-hidden="true"></span>
        <span class="flame" aria-hidden="true">
          <i class="f-outer"></i>
          <i class="f-inner"></i>
          <i class="f-core"></i>
        </span>
        <span class="wick" aria-hidden="true"></span>
        <span class="wax" aria-hidden="true"></span>
        <span class="halo" aria-hidden="true"></span>
      </button>
      <p class="opening">
        <span>哥哥</span>
        <span>陪你过生日</span>
        <span>点个蜡烛吧</span>
      </p>
      <p class="light-hint">长按烛芯，点蜡烛</p>
    </section>

    <section class="bridge" id="bridge" hidden>
      <p>感谢你<br />陪我走过一天又一天<br />这些天见证你的成长<br />也见证我的成长</p>
    </section>

    <main class="stage" id="stage" hidden aria-live="polite">
      <div class="stage-inner single" id="stage-inner">
        <div class="cluster" id="cluster"></div>
        <p class="reel-mark" id="reel-mark" hidden></p>
        <p class="copy page-copy" id="page-copy" hidden></p>
      </div>
    </main>
    <p class="skip-hint" id="skip-hint">左边上一页 · 右边下一页</p>
    <div class="pace-dock" id="pace-dock">
      <span>慢</span>
      <input id="watch-pace" type="range" min="0" max="10" step="1" value="5" aria-label="照片自动翻页的速度" />
      <span>快</span>
    </div>

    <section class="finale" id="finale" hidden>
      <div class="wall" id="wall" aria-hidden="true"></div>
      <button class="candle lit" id="quench" type="button" aria-label="按住火苗">
        <span class="aura" aria-hidden="true"></span>
        <span class="flame" aria-hidden="true">
          <i class="f-outer"></i>
          <i class="f-inner"></i>
          <i class="f-core"></i>
        </span>
        <span class="wick" aria-hidden="true"></span>
        <span class="wax" aria-hidden="true"></span>
        <span class="halo" aria-hidden="true"></span>
      </button>
      <div class="finale-words">
        <p class="wish">生日快乐 许个愿吧</p>
        <p class="blow-cue" id="blow-cue">吹蜡烛吧</p>
        <p class="blessing">
          <span>哥哥</span>
          <span>生日快乐</span>
          <span>愿你快乐</span>
        </p>
      </div>
    </section>

    <button class="edit-entry" id="edit-entry" type="button">编排</button>
    <section class="editor" id="editor" hidden>
      <div class="editor-bar">
        <div class="editor-intro">
          <p class="editor-title">编排这一卷</p>
          <p class="editor-lead">照片没有页数上限，点「加一页」就行。每一页最多六张，都会一张一张出来。按住「拖动排序」，可以调整每一页的先后。这一页可以写一句总的，每张也可以单独写一句，不写就空着。</p>
        </div>
        <div class="editor-actions">
          <button type="button" id="add-page">加一页</button>
          <button type="button" id="save-pages">保存</button>
          <button type="button" id="close-editor">收起</button>
        </div>
        <p class="editor-note" id="editor-note"></p>
      </div>
      <div class="editor-list" id="editor-list">
        <article class="page-card" id="script-card">
          <h3>开场和结尾</h3>
          <label class="pace">
            照片自动翻页
            <span class="pace-row">
              <span>慢</span>
              <input id="line-pace" type="range" min="0" max="10" step="1" value="5" aria-label="照片自动翻页的速度" />
              <span>快</span>
            </span>
            <span class="pace-read" id="pace-read">短句大约 2.4 秒，句子长会再多停一会</span>
          </label>
          <label class="words">点蜡烛之前<textarea id="line-opening" data-line="opening" rows="3"></textarea></label>
          <label class="words">点亮之后<textarea id="line-bridge" data-line="bridge" rows="2"></textarea></label>
          <label class="words">最后一页，吹之前<textarea id="line-wish" data-line="wish" rows="2"></textarea></label>
          <label class="words">十五秒后换成<input id="line-blow" data-line="blow" /></label>
          <label class="words">吹灭之后<textarea id="line-blessing" data-line="blessing" rows="3"></textarea></label>
        </article>
        <article class="page-card" id="music-card">
          <h3>音乐</h3>
          <div class="music-picks">
            <label><input type="radio" name="music" value="night" checked /> 轻快</label>
            <label><input type="radio" name="music" value="warm" /> 明亮</label>
            <label><input type="radio" name="music" value="hush" /> 柔和</label>
            <label><input type="radio" name="music" value="off" /> 不放</label>
            <label><input type="radio" name="music" value="file" /> 自己的一首</label>
          </div>
          <label class="file-music">选一个音频文件<input id="music-file" type="file" accept="audio/*" /></label>
          <p class="music-name" id="music-name"></p>
          <button type="button" id="preview-music">听一下</button>
        </article>
        <div id="page-list"></div>
      </div>
    </section>
